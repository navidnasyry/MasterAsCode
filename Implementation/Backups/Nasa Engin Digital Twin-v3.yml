    id: 84073d10-4ba6-4401-a333-7e4490fc8803
    name: not_related_questoin
    selector:
    - env
    - not_related_questoin
    value: "\U0001F44B **سلام!**  \nمن **دوقلوی مجازی موتورهای CMAPSS ناسا** هستم\
      \ و می‌توانم درباره‌ی وضعیت و عملکرد موتورهای شبیه‌سازی‌شده به تو کمک کنم. \
      \ \nکارهایی که می‌توانی از من بخواهی عبارت‌اند از:  \n\n---\n\n### 1️⃣ بررسی\
      \ وضعیت یک موتور خاص  \nمی‌توانم وضعیت عملکردی یک موتور مشخص را برایت تحلیل\
      \ کنم.  \n\n\U0001F7E2 **مثال‌ها:**  \n- موتور ۴ در چه شرایطی است؟  \n- موتور\
      \ ۱۰ چه زمانی خراب می‌شود؟  \n\n---\n\n### 2️⃣ خاموش کردن موتورهای در خطر  \n\
      می‌توانم موتورهایی را که در خطر خرابی هستند خاموش کنم تا از آسیب بیشتر جلوگیری\
      \ شود.  \n\n\U0001F7E2 **مثال‌ها:**  \n- موتورهای در خطر را خاموش کن.  \n\n\
      ---\n\n### 3️⃣ خاموش کردن همه‌ی موتور‌ها  \nمی‌توانم در صورت نیاز، همه‌ی موتور‌ها\
      \ را به‌طور هم‌زمان خاموش کنم.  \n\n\U0001F7E2 **مثال‌ها:**  \n- همه‌ی موتور‌ها\
      \ را خاموش کن.  \n\n---\n\n### 3️⃣ روشن کردن همه‌ی موتور‌ها  \nمی‌توانم همه‌ی\
      \ موتور‌ها را روشن کنم تا سیستم دوباره فعال شود.  \n\n\U0001F7E2 **مثال‌ها:**\
      \  \n- همه‌ی موتور‌ها را روشن کن.  \n\n---\n\n\U0001F4A1 فقط کافیست درخواستت\
      \ را به زبان طبیعی بگویی، من تحلیل می‌کنم و پاسخ مناسب را ارائه می‌دهم.\n"
    value_type: string
  - description: ''
    id: e41e0231-2e40-4e95-be67-8767df2c6dbb
    name: threshold
    selector:
    - env
    - threshold
