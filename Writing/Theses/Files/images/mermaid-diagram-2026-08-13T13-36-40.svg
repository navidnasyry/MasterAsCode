is " id="flowchart-n4-3" transform="translate(437.8499984741211, 411)"><rect class="basic label-container" style="fill:#eef1f4 !important;stroke:#1f3a5f !important;stroke-width:1.5px !important" x="-119.8499984741211" y="-63" width="239.6999969482422" height="126"></rect><g class="label" style="color:#1a1a1a !important" transform="translate(-89.8499984741211, -48)"><rect></rect><foreignObject width="179.6999969482422" height="96"><div style="color: rgb(26, 26, 26) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel "><div dir="rtl" style="text-align:right"><b>۲. طراحی معماری مفهومی</b><br/>چارچوب پنج‌لایه چندعاملی<br/>عامل پیش‌بینی، پایش، تعامل زبانی<br/>پروتکل پیام میان لایه‌ها</div></span></div></foreignObject></g></g><g class="node default thesis " id="flowchart-n5-4" transform="translate(287.92499923706055, 611)"><rect class="basic label-container" style="fill:#eef1f4 !important;stroke:#1f3a5f !important;stroke-width:1.5px !important" x="-130" y="-75" width="260" height="150"></rect><g class="label" style="color:#1a1a1a !important" transform="translate(-100, -60)"><rect></rect><foreignObject width="200" height="120"><div style="color: rgb(26, 26, 26) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1a1a1a !important" class="nodeLabel "><div dir="rtl" style="text-align:right"><b>۵. شکاف‌ها و پاسخ معماری</b><br/>نبود یکپارچگی سیستمی<br/>ضعف توضیح‌پذیری حسگرمحور<br/>هزینه نامتقارن خطا: سوگیری آگاهانه به کم‌برآورد</div></span></div></foreignObject></g></g><g class="node default thesis " id="flowchart-n6-5" transform="translate(287.92499923706055, 811)"><rect class="basic label-container" style="fill:#eef1f4 !important;stroke:#1f3a5f !important;stroke-width:1.5px !important" x="-130" y=